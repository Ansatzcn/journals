<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Journals</title>
<style>

5e1;border-radius:15px;background:#fff;color:#0f172a;outline:none}.form-group textarea{min-height:76px;resize:vertical}.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:2px solid #93b4ff;outline-offset:1px;border-color:transparent}.hint{color:#94a3b8;font-size:.75rem;line-height:1.45}.add-button{grid-column:1/-1;min-height:46px;border:0;border-radius:999px;background:#1e293b;color:#fff;font-weight:700}.list-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:.8rem}.badge{min-width:38px;padding:.22rem .8rem;border-radius:999px;background:#e8edf4;color:#334155;text-align:center;font-size:.8rem}.journal-list{border:1px solid #e2e8f0;border-radius:20px;overflow:hidden}.journal-item{padding:1rem 1.15rem;background:#fff}.journal-item+.journal-item{border-top:2px solid #dbe3ed}.journal-item:hover{background:#fafcff}.journal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}.journal-name{font-weight:700;line-height:1.5;overflow-wrap:anywhere}.journal-details{margin-top:.3rem;color:#000;font-size:.92rem;line-height:1.6}.journal-detail{display:block;color:#000;overflow-wrap:anywhere}.actions{display:flex;gap:6px;white-space:nowrap}.action-btn{padding:.28rem .72rem;border:0;border-radius:999px;font-size:.82rem;font-weight:650}.edit-btn{background:#dbeafe;color:#1e3a8a}.delete-btn{background:#fee2e2;color:#991b1b}.empty{padding:2.6rem 1rem;background:#fafcff;color:#94a3b8;text-align:center}.overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(15,23,42,.45);backdrop-filter:blur(5px)}.dialog{width:min(100%,560px);max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:26px;box-shadow:0 30px 70px rgba(15,23,42,.28)}.dialog-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;padding:1.7rem 1.7rem 1rem}.dialog h3{margin-bottom:.4rem}.dialog-desc{margin-bottom:1.1rem;padding-bottom:.8rem;border-bottom:1px solid #e8edf4;color:#64748b;font-size:.87rem;line-height:1.55}.dialog .form-group{margin-bottom:.95rem}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;padding:.95rem 1.7rem max(.95rem,env(safe-area-inset-bottom));border-top:1px solid #e8edf4;background:#fff}.token-note{color:#64748b;font-size:.78rem;line-height:1.5}.toast{position:fixed;left:50%;bottom:28px;z-index:1500;transform:translateX(-50%);max-width:90vw;padding:.78rem 1.5rem;border-radius:999px;background:#2563eb;color:#fff;font-size:.88rem;font-weight:600}.toast.success{background:#16a34a}.toast.error{background:#dc2626}.back-top{position:fixed;right:16px;top:68%;transform:translateY(-50%);z-index:900;padding:.45rem .72rem;border:1px solid rgba(148,163,184,.45);border-radius:999px;background:rgba(255,255,255,.82);color:#64748b;font-size:.76rem;opacity:0;visibility:hidden;pointer-events:none}.back-top.visible{opacity:.55;visibility:visible;pointer-events:auto}@media(max-width:700px){body{padding:.8rem}.container{padding:1.25rem;border-radius:22px}.page-title{font-size:1.8rem}.toolbar{align-items:stretch;flex-direction:column}.toolbar-group{justify-content:center}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.journal-head{gap:.6rem}.actions{flex-direction:column}.dialog{width:100%;max-height:calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));border-radius:20px}.dialog-scroll{padding:1.2rem 1.2rem .8rem}.dialog-actions{padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom))}.dialog-actions .btn{flex:1}.back-top{right:8px}}
</style>
</head>
<body>
<main class="container">
<h1 class="page-title">Journals <span class="cloud"><span class="dot" id="statusDot"></span><span id="statusText">正在读取公开数据…</span></span></h1>
<section class="toolbar"><div class="toolbar-group"><button class="btn btn-sync hidden" id="syncBtn">同步</button><button class="btn" id="configBtn">配置</button><button class="btn" id="exportBtn">导出</button><button class="btn hidden" id="importBtn">导入</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div><span class="last-sync" id="lastSync">公开阅读无需 Token</span></section>
<section class="add-section hidden" id="addSection"><h2>添加</h2><div class="form-grid">
<div class="form-group full"><label for="journalInput">刊名 <span class="required">*</span></label><input id="journalInput" type="text" autocomplete="off"></div>
<div class="form-group"><label for="issnInput">刊号</label><input id="issnInput" type="text" autocomplete="off"></div>
<div class="form-group"><label for="subjectInput">学科</label><input id="subjectInput" type="text" list="subjectOptions" autocomplete="off"><datalist id="subjectOptions"></datalist><div class="hint">不预置学科；点击输入框可选择此前填写过的学科，也可直接输入新学科，保存后会自动记住。</div></div>
<div class="form-group full"><label for="remarkInput">备注</label><textarea id="remarkInput"></textarea></div>
<button class="add-button" id="addBtn" type="button">添加</button></div></section>
<section><div class="list-header"><h2>总表</h2><span class="badge" id="countDisplay">0</span></div><div class="journal-list" id="journalList"><div class="empty">加载中…</div></div></section>
</main>
<section class="overlay hidden" id="editModal"><div class="dialog"><div class="dialog-scroll"><h3>编辑期刊</h3><p class="dialog-desc">刊名为必填；刊号、学科和备注均可留空。</p><div class="form-group"><label>刊名 <span class="required">*</span></label><input id="editJournal" type="text"></div><div class="form-group"><label>刊号</label><input id="editIssn" type="text"></div><div class="form-group"><label>学科</label><input id="editSubject" type="text" list="subjectOptions"></div><div class="form-group"><label>备注</label><textarea id="editRemark"></textarea></div></div><div class="dialog-actions"><button class="btn" id="editCancel" type="button">取消</button><button class="btn btn-primary" id="editSave" type="button">保存</button></div></div></section>
<section class="overlay hidden" id="configModal"><form class="dialog" id="configForm" autocomplete="on"><div class="dialog-scroll"><h3>GitHub 管理配置</h3><p class="dialog-desc">所有访客都可直接读取同目录的 journals_data.json，无需 Token；只有修改内容时需要管理 Token。</p><div class="form-group"><label>仓库所有者 *</label><input id="cfgOwner" name="github-owner" autocomplete="username"></div><div class="form-group"><label>仓库名称 *</label><input id="cfgRepo"></div><div class="form-group"><label>数据文件路径</label><input id="cfgFile" value="journals_data.json"></div><div class="form-group"><label>GitHub Personal Access Token *</label><input id="cfgToken" type="password" name="github-token-new" autocomplete="new-password" spellcheck="false"><div class="token-note">在本设备保存Token。若浏览器出现“保存密码”提示，请选择保存；开启浏览器密码同步后，其他设备可自动填充。</div></div></div><div class="dialog-actions"><button class="btn" id="configCancel" type="button">取消</button><button class="btn btn-primary" type="submit">保存并连接</button></div></form></section>
<button class="back-top" id="backTop" type="button">↑ 回到顶部</button><div class="toast hidden" id="toast"></div>
<script>
(()=>{'use strict';
const PUBLIC_FILE='journals_data.json',NS='journals_v1',STATE_KEY=NS+':state',CONFIG_KEY=NS+':config',TOKEN_KEY=NS+':token',META_KEY=NS+':meta',MAX=750*1024;
const $=id=>document.getElementById(id),statusDot=$('statusDot'),statusText=$('statusText'),syncBtn=$('syncBtn'),configBtn=$('configBtn'),exportBtn=$('exportBtn'),importBtn=$('importBtn'),fileInput=$('fileInput'),lastSync=$('lastSync'),addSection=$('addSection'),journalInput=$('journalInput'),issnInput=$('issnInput'),subjectInput=$('subjectInput'),subjectOptions=$('subjectOptions'),remarkInput=$('remarkInput'),addBtn=$('addBtn'),journalList=$('journalList'),countDisplay=$('countDisplay'),editModal=$('editModal'),editJournal=$('editJournal'),editIssn=$('editIssn'),editSubject=$('editSubject'),editRemark=$('editRemark'),editCancel=$('editCancel'),editSave=$('editSave'),configModal=$('configModal'),configForm=$('configForm'),cfgOwner=$('cfgOwner'),cfgRepo=$('cfgRepo'),cfgFile=$('cfgFile'),cfgToken=$('cfgToken'),configCancel=$('configCancel'),backTop=$('backTop'),toast=$('toast');
let state={entries:[],subjects:[]},editingId='',config={owner:'',repo:'',file:'journals_data.json',token:''},meta={target:'',sha:null,fp:null,time:null},syncing=false,timer=null,toastTimer=null;
const coll=new Intl.Collator('zh-CN-u-co-pinyin',{sensitivity:'base',numeric:true});
function clean(v){return String(v??'').normalize('NFKC').trim()}function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}function attr(v){return esc(v).replace(/"/g,'&quot;')}function uid(){return crypto?.randomUUID?crypto.randomUUID():'j_'+Date.now()+'_'+Math.random().toString(36).slice(2,9)}function key(v){return clean(v).toLocaleLowerCase('zh-CN')}
function subjects(a){const m=new Map();for(const x of a||[]){const s=clean(x);if(s&&!m.has(key(s)))m.set(key(s),s)}return [...m.values()].sort(coll.compare)}
function normEntry(x){if(!x||typeof x!=='object')return null;const name=clean(x.name??x.journal??x.title);if(!name)return null;return{id:clean(x.id)||uid(),name,issn:clean(x.issn??x.number),subject:clean(x.subject),remark:clean(x.remark??x.note)}}
function norm(v){const s=Array.isArray(v)?{entries:v,subjects:[]}:(v&&typeof v==='object'?v:{}),entries=(Array.isArray(s.entries)?s.entries:[]).map(normEntry).filter(Boolean);entries.sort((a,b)=>{const ai=clean(a.issn),bi=clean(b.issn);if(ai&&!bi)return-1;if(!ai&&bi)return 1;const byIssn=coll.compare(ai,bi);return byIssn!==0?byIssn:coll.compare(a.name,b.name)});return{schemaVersion:1,entries,subjects:subjects([...(Array.isArray(s.subjects)?s.subjects:[]),...entries.map(x=>x.subject).filter(Boolean)])}}
function fp(v=state){return JSON.stringify(norm(v))}function localGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function localSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}function saveLocal(){state=norm(state);localSet(STATE_KEY,JSON.stringify(state))}function loadLocal(){const s=localGet(STATE_KEY);if(!s)return null;try{return norm(JSON.parse(s))}catch(e){return null}}
function admin(){return !!(config.owner&&config.repo&&config.file&&config.token)}function target(){return config.owner&&config.repo&&config.file?config.owner+'/'+config.repo+'/'+config.file:''}function setStatus(k,t){statusDot.className='dot '+k;statusText.textContent=t}function show(msg,type='info'){toast.textContent=msg;toast.className='toast '+type;toast.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.add('hidden'),3000)}function updateAdmin(){const on=admin();addSection.classList.toggle('hidden',!on);syncBtn.classList.toggle('hidden',!on);importBtn.classList.toggle('hidden',!on)}
function renderSubjects(){state.subjects=subjects([...state.subjects,...state.entries.map(x=>x.subject).filter(Boolean)]);subjectOptions.innerHTML=state.subjects.map(x=>'<option value="'+attr(x)+'"></option>').join('')}function line(label,v){v=clean(v);return v?'<span class="journal-detail">'+esc(label)+'：'+esc(v)+'</span>':''}
function render(){state=norm(state);countDisplay.textContent=state.entries.length;renderSubjects();updateAdmin();if(!state.entries.length)journalList.innerHTML='<div class="empty">暂无期刊条目</div>';else journalList.innerHTML=state.entries.map(x=>'<article class="journal-item" data-id="'+attr(x.id)+'"><div class="journal-head"><div><div class="journal-name">'+esc(x.name)+'</div><div class="journal-details">'+line('刊号',x.issn)+line('学科',x.subject)+line('备注',x.remark)+'</div></div>'+(admin()?'<div class="actions"><button class="action-btn edit-btn" data-id="'+attr(x.id)+'">编辑</button><button class="action-btn delete-btn" data-id="'+attr(x.id)+'">删除</button></div>':'')+'</div></article>').join('');saveLocal()}
function publicUrl(){return location.pathname.replace(/[^/]*$/,'')+PUBLIC_FILE+'?v='+Date.now()}async function loadPublic(){setStatus('syncing','正在读取公开数据…');try{const r=await fetch(publicUrl(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const pub=norm(await r.json()),local=loadLocal(),baseline=meta.target===target()?meta.fp:null,unsynced=admin()&&local&&baseline&&fp(local)!==baseline;state=unsynced?local:pub;render();setStatus(unsynced?'offline':'online',unsynced?'有未同步修改':'公开阅读');lastSync.textContent=unsynced?'显示当前浏览器中的未同步数据':'公开数据 · '+state.entries.length+' 条'}catch(e){const local=loadLocal();state=local||{entries:[],subjects:[]};render();setStatus('offline','公开数据读取失败');lastSync.textContent=local?'暂时显示当前浏览器缓存':'请确认 journals_data.json 与网页位于同一目录'}}
function rememberSubject(v){v=clean(v);if(v)state.subjects=subjects([...state.subjects,v])}function add(){if(!admin())return;const name=clean(journalInput.value);if(!name){show('请输入刊名','error');journalInput.focus();return}const x={id:uid(),name,issn:clean(issnInput.value),subject:clean(subjectInput.value),remark:clean(remarkInput.value)};rememberSubject(x.subject);state.entries.push(x);journalInput.value=issnInput.value=subjectInput.value=remarkInput.value='';render();schedule();journalInput.focus();show('已添加','success')}
function openEdit(id){if(!admin())return;const x=state.entries.find(v=>v.id===id);if(!x)return;editingId=id;editJournal.value=x.name;editIssn.value=x.issn;editSubject.value=x.subject;editRemark.value=x.remark;editModal.classList.remove('hidden')}function closeEdit(){editingId='';editModal.classList.add('hidden')}function saveEdit(){const x=state.entries.find(v=>v.id===editingId);if(!x)return closeEdit();const name=clean(editJournal.value);if(!name){show('请输入刊名','error');return}x.name=name;x.issn=clean(editIssn.value);x.subject=clean(editSubject.value);x.remark=clean(editRemark.value);rememberSubject(x.subject);closeEdit();render();schedule();show('已保存','success')}function del(id){const x=state.entries.find(v=>v.id===id);if(!x||!confirm('确定删除“'+x.name+'”吗？'))return;state.entries=state.entries.filter(v=>v.id!==id);render();schedule();show('已删除','success')}
function loadConfig(){let c={};try{c=JSON.parse(localGet(CONFIG_KEY)||'{}')}catch(e){}config={owner:clean(c.owner),repo:clean(c.repo),file:clean(c.file)||'journals_data.json',token:localGet(TOKEN_KEY)||''};cfgOwner.value=config.owner;cfgRepo.value=config.repo;cfgFile.value=config.file;cfgToken.value=config.token;updateAdmin()}function saveConfig(e){e.preventDefault();const owner=clean(cfgOwner.value),repo=clean(cfgRepo.value),file=clean(cfgFile.value)||'journals_data.json',token=clean(cfgToken.value);if(!owner||!repo||!token){show('请完整填写仓库和 Token','error');return}config={owner,repo,file,token};localSet(CONFIG_KEY,JSON.stringify({owner,repo,file}));localSet(TOKEN_KEY,token);configModal.classList.add('hidden');updateAdmin();render();show('管理配置已保存','success');sync(true)}
function loadMeta(){try{const m=JSON.parse(localGet(META_KEY)||'{}');meta={target:clean(m.target),sha:clean(m.sha)||null,fp:typeof m.fp==='string'?m.fp:null,time:clean(m.time)||null}}catch(e){}}function record(s,sha){meta={target:target(),sha:sha||null,fp:fp(s),time:new Date().toISOString()};localSet(META_KEY,JSON.stringify(meta));lastSync.textContent='已同步 '+new Date(meta.time).toLocaleString()}
function encPath(p){return String(p).split('/').filter(Boolean).map(encodeURIComponent).join('/')}async function api(method,endpoint,body){const r=await fetch('https://api.github.com/repos/'+encodeURIComponent(config.owner)+'/'+encodeURIComponent(config.repo)+'/'+endpoint,{method,headers:{Authorization:'Bearer '+config.token,Accept:'application/vnd.github+json',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const raw=await r.text();let d=null;if(raw)try{d=JSON.parse(raw)}catch(e){d={message:raw}}if(!r.ok){const e=new Error(d?.message||'HTTP '+r.status);e.status=r.status;throw e}return d}function b64(s){const bytes=new TextEncoder().encode(s);let b='';for(let i=0;i<bytes.length;i+=32768)b+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(b)}function unb64(s){const b=atob(String(s||'').replace(/\s/g,'')),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new TextDecoder().decode(a)}
async function readRemote(){try{const d=await api('GET','contents/'+encPath(config.file));return{exists:true,sha:d.sha,state:norm(JSON.parse(unb64(d.content)))}}catch(e){if(e.status===404)return{exists:false,sha:null,state:{entries:[],subjects:[]}};throw e}}async function writeRemote(s,sha){const raw=JSON.stringify(norm(s),null,2);if(new TextEncoder().encode(raw).length>MAX)throw new Error('数据超过 750 KB');const body={message:'更新 Journals 数据 - '+new Date().toLocaleString(),content:b64(raw)};if(sha)body.sha=sha;const d=await api('PUT','contents/'+encPath(config.file),body);return d?.content?.sha||null}
async function sync(showToast=true){if(!admin()){show('请先配置管理 Token','error');return}if(syncing)return;syncing=true;syncBtn.disabled=true;setStatus('syncing','同步中…');try{const r=await readRemote(),lf=fp(state),rf=fp(r.state),baseline=meta.target===target()?meta.fp:null;if(!r.exists){record(state,await writeRemote(state,null))}else if(lf===rf){record(state,r.sha)}else if(baseline&&lf!==baseline&&rf===baseline){record(state,await writeRemote(state,r.sha))}else if(baseline&&lf===baseline&&rf!==baseline){state=r.state;render();record(state,r.sha)}else{const useLocal=confirm('本地与 GitHub 数据不同。\n\n确定：用当前网页数据覆盖 GitHub。\n取消：采用 GitHub 数据。');if(useLocal)record(state,await writeRemote(state,r.sha));else{state=r.state;render();record(state,r.sha)}}setStatus('online','公开阅读 · 管理已连接');if(showToast)show('同步完成','success')}catch(e){setStatus('offline','管理同步失败');show('同步失败：'+e.message,'error')}finally{syncing=false;syncBtn.disabled=false}}function schedule(){saveLocal();if(!admin())return;clearTimeout(timer);timer=setTimeout(()=>sync(false),700)}
function exportData(){const blob=new Blob([JSON.stringify(norm(state),null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='journals_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}function importData(file){if(!admin()||!file)return;const r=new FileReader();r.onload=e=>{try{if(!confirm('导入会替换当前数据，确定继续吗？'))return;state=norm(JSON.parse(e.target.result));render();schedule();show('导入成功','success')}catch(err){show('导入失败：'+err.message,'error')}};r.readAsText(file,'utf-8')}
subjectInput.addEventListener('click',()=>{try{subjectInput.showPicker?.()}catch(e){}});editSubject.addEventListener('click',()=>{try{editSubject.showPicker?.()}catch(e){}});addBtn.addEventListener('click',add);journalList.addEventListener('click',e=>{const a=e.target.closest('.edit-btn');if(a)return openEdit(a.dataset.id);const d=e.target.closest('.delete-btn');if(d)del(d.dataset.id)});editCancel.addEventListener('click',closeEdit);editSave.addEventListener('click',saveEdit);editModal.addEventListener('click',e=>{if(e.target===editModal)closeEdit()});configBtn.addEventListener('click',()=>configModal.classList.remove('hidden'));configCancel.addEventListener('click',()=>configModal.classList.add('hidden'));configForm.addEventListener('submit',saveConfig);syncBtn.addEventListener('click',()=>sync(true));exportBtn.addEventListener('click',exportData);importBtn.addEventListener('click',()=>fileInput.click());fileInput.addEventListener('change',()=>{importData(fileInput.files?.[0]);fileInput.value=''});backTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));addEventListener('scroll',()=>backTop.classList.toggle('visible',scrollY>260),{passive:true});
loadConfig();loadMeta();loadPublic().then(()=>{if(admin())sync(false)});
})();
</script>
</body>
</html>
